services:
  app:
    container_name: ldc-shop
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DB_TYPE: ${DB_TYPE:-sqlite}
      DATABASE_PATH: /app/data/ldc-shop.sqlite
      DATABASE_URL: ${DATABASE_URL:-}
